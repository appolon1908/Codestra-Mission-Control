name: Mission Control CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-ci.txt setuptools wheel
      - run: python -m pip install --no-build-isolation -c requirements-ci.txt -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - run: python -m pytest -q
